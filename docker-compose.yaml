volumes:
  payments-db-data:
  payments-rabbitmq-data:

services:
  payments-db:
    image: postgres:18
    container_name: payments-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - payments-db-data:/var/lib/postgresql
    restart: &restart unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "PGUSER=$${POSTGRES_USER} PGDATABASE=$${POSTGRES_DB} pg_isready" ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  payments-rabbitmq:
    image: rabbitmq:4-management
    container_name: payments-rabbitmq
    volumes:
      - payments-rabbitmq-data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_ADMIN_HOST_PORT}:15672"
    restart: *restart
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics check_port_connectivity" ]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 3

  payments-migrate:
    build: .
    container_name: payments-migrate
    command: uv run alembic upgrade head
    env_file: .env
    environment: &app_env
      POSTGRES_HOST: payments-db
      POSTGRES_HOST_PORT: 5432
      RABBITMQ_HOST: payments-rabbitmq
      RABBITMQ_HOST_PORT: 5672
    depends_on:
      payments-db:
        condition: service_healthy
    restart: "no"

  payments-api:
    build: .
    container_name: payments-api
    env_file: .env
    environment: *app_env
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8000"
    depends_on:
      payments-migrate:
        condition: service_completed_successfully
    restart: *restart
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  payments-consumer:
    build: .
    container_name: payments-consumer
    command: uv run python -m src.consumer
    env_file: .env
    environment: *app_env
    depends_on:
      payments-migrate:
        condition: service_completed_successfully
      payments-rabbitmq:
        condition: service_healthy
    restart: *restart

  payments-relay:
    build: .
    container_name: payments-relay
    command: uv run python -m src.relay
    env_file: .env
    environment: *app_env
    depends_on:
      payments-migrate:
        condition: service_completed_successfully
      payments-rabbitmq:
        condition: service_healthy
    restart: *restart
